name: pr-check

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test1234
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: dependency:tree 출력 (충돌 확인용)
        run: mvn -B dependency:tree
      - name: Test and coverage check
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: testdb
          DB_USERNAME: test
          DB_PASSWORD: test1234
          Auth_DB_SCHEMA: public
          JWT_SECRET: test-jwt-secret-for-ci-only-please-ignore
          JWT_ACCESSTOKEN_EXPIRATION_MS: 100000
          JWT_REFRESHTOKEN_EXPIRATION_MS: 200000000
        run: ./mvnw -B clean verify
      - name: Docker 이미지 빌드 테스트 (push는 안 함)
        run: docker build -t user-server:pr-test .