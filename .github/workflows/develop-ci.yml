name: develop-ci

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Test and JaCoCo 40% coverage check
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: testdb
          DB_USERNAME: test
          DB_PASSWORD: test1234
          Auth_DB_SCHEMA: public
          JWT_SECRET: test-jwt-secret-for-ci-only-please-ignore
          JWT_ACCESSTOKEN_EXPIRATION_MS: 100000
          JWT_REFRESHTOKEN_EXPIRATION_MS: 200000000
        run: ./mvnw -B clean verify